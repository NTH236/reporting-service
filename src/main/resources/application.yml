server:
  port: 8084

spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:h2:mem:reportingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# SOA Services Integration Endpoints
services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: 5000
    read-timeout-ms: 5000

# Springdoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.example.reporting: DEBUG
    org.hibernate.SQL: DEBUG

